<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Portal Siswa{% endblock %} - E-Prestasi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --cream: #fffbde;
        --sky: #91c8e4;
        --slate: #749bc2;
        --deep: #4682a9;
        --deep-dark: #35657f;
        --ink: #1f3b4d;
        --nav-bg: #1e3f52;
    }
    body {
        background-color: #fbf9ec;
        font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: var(--ink);
    }
    
    /* Navbar Menggunakan Warna Deep Sidebar Admin */
    .navbar-eprestasi {
        background: linear-gradient(135deg, var(--nav-bg) 0%, #2c5871 100%);
        padding: .8rem 1.5rem;
        box-shadow: 0 4px 12px rgba(31,59,77,.15);
    }
    .navbar-eprestasi .brand {
        font-weight: 800;
        color: #fff;
        font-size: 1.25rem;
        letter-spacing: .3px;
        display: flex;
        align-items: center;
        gap: .5rem;
    }
    .navbar-eprestasi .brand i { color: var(--sky); }
    
    .navbar-eprestasi .nav-link {
        color: #cfe3ee;
        font-weight: 500;
        font-size: .9rem;
        padding: .5rem .9rem !important;
        border-radius: .55rem;
        transition: all .2s;
        display: flex;
        align-items: center;
        gap: .4rem;
    }
    .navbar-eprestasi .nav-link:hover {
        color: #fff;
        background: rgba(255,255,255,.08);
    }
    .navbar-eprestasi .nav-link.active {
        background: var(--deep);
        color: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    
    /* Tombol Keluar / User Tag */
    .btn-logout {
        color: #ffd8d8;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        font-weight: 600;
        font-size: .85rem;
        border-radius: .55rem;
        padding: .4rem .8rem;
        transition: all .2s;
    }
    .btn-logout:hover {
        background: rgba(220,53,69,.25);
        color: #fff;
        border-color: rgba(220,53,69,.3);
    }
    
    /* Content Layout */
    .content-wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem; }
    .card { border: none; border-radius: .9rem; box-shadow: 0 2px 14px rgba(31,59,77,.08); }
    
    /* Buttons & Badges Tema E-Prestasi */
    .btn-primary { background-color: var(--deep); border-color: var(--deep); }
    .btn-primary:hover { background-color: var(--deep-dark); border-color: var(--deep-dark); }
    .btn-outline-primary { color: var(--deep); border-color: var(--deep); }
    .btn-outline-primary:hover { background-color: var(--deep); border-color: var(--deep); }
    
    .badge-aktif { background-color: #16a34a; }
    .badge-alumni { background-color: #6b7280; }
    .badge-nonaktif { background-color: #9ca3af; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-eprestasi navbar-expand-lg sticky-top">
    <div class="container-fluid px-2">
        <span class="brand">
            <i class="bi bi-award-fill"></i> E-Prestasi
        </span>

        {% if not wajib_diisi %}
        <div class="d-flex gap-1 ms-auto me-3">
            <a href="{% url 'siswa_dashboard' %}" class="nav-link {% if active_menu == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="{% url 'siswa_prestasi_list' %}" class="nav-link {% if active_menu == 'prestasi' %}active{% endif %}">
                <i class="bi bi-trophy"></i> Prestasi Saya
            </a>
            <a href="{% url 'siswa_lengkapi_profil' %}" class="nav-link {% if active_menu == 'profil' %}active{% endif %}">
                <i class="bi bi-person-circle"></i> Profil Saya
            </a>
        </div>
        {% endif %}

        <a href="{% url 'logout' %}" class="btn btn-logout text-decoration-none ms-auto ms-lg-0">
            <i class="bi bi-box-arrow-right"></i> Keluar
        </a>
    </div>
</nav>

<div class="content-wrap">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'success' }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
