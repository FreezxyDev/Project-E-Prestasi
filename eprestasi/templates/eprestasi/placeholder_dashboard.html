<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ judul }} - ePrestasi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    body { background: #f4f5fa; font-family: 'Segoe UI', system-ui, sans-serif; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 460px; border: none; border-radius: 1rem; box-shadow: 0 10px 30px rgba(30,27,58,.08); }
</style>
</head>
<body>
<div class="wrap">
    <div class="card p-4 text-center">
        <i class="bi bi-cone-striped fs-1 mb-3" style="color:#4338ca;"></i>
        <h5 class="fw-bold">{{ judul }}</h5>
        <p class="text-muted">Halo, <strong>{{ nama_tampil }}</strong> 👋</p>
        <p class="text-muted small">{{ pesan }}</p>
        <a href="{% url 'logout' %}" class="btn btn-outline-secondary btn-sm mt-2">Keluar</a>
    </div>
</div>
</body>
</html>
