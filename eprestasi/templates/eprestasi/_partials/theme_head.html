{# Pasang di <head> SEBELUM stylesheet. Menentukan tema (terang/gelap) sebelum halaman digambar supaya tidak berkedip. #}
<link rel="icon" type="image/svg+xml" href="https://res.cloudinary.com/yt2nmoa9/image/upload/v1794448715/eprestasi-logo_xlyqvd.svg">
<script>
(function () {
    var t = 'light';
    try { t = localStorage.getItem('eprestasi-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-bs-theme', t);
    document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="color-scheme" content="light dark">
