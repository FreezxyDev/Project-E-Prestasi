<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Portal Kesiswaan{% endblock %} - ePrestasi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
    :root { --brand: #0d9488; --brand-dark: #0f766e; }
    body { background: #f4f5fa; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .navbar-eprestasi {
        background: #fff;
        border-bottom: 1px solid #e5e6f0;
        padding: .8rem 1.5rem;
    }
    .navbar-eprestasi .brand { font-weight: 800; color: var(--brand); }
    .navbar-eprestasi .brand i { margin-right: .3rem; }
    .navbar-eprestasi .nav-link {
        color: #4b4f6b;
        font-weight: 500;
        font-size: .9rem;
        padding: .4rem .9rem !important;
        border-radius: .5rem;
    }
    .navbar-eprestasi .nav-link.active { background: #ccfbf1; color: var(--brand); }
    .content-wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem; }
    .card { border: none; border-radius: .9rem; box-shadow: 0 2px 10px rgba(30,27,58,.06); }
    .btn-primary { background-color: var(--brand); border-color: var(--brand); }
    .btn-primary:hover { background-color: var(--brand-dark); border-color: var(--brand-dark); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-eprestasi navbar-expand-lg">
    <div class="container-fluid px-2">
        <span class="brand"><i class="bi bi-award-fill"></i>ePrestasi <small class="fw-normal text-muted">Kesiswaan</small></span>

        {% if not wajib_diisi %}
        <div class="d-flex gap-1 ms-auto me-3">
            <a href="{% url 'kesiswaan_dashboard' %}" class="nav-link {% if active_menu == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="{% url 'kesiswaan_verifikasi_list' %}" class="nav-link {% if active_menu == 'verifikasi' %}active{% endif %}">
                <i class="bi bi-patch-check"></i> Verifikasi
            </a>
            <a href="{% url 'kesiswaan_riwayat' %}" class="nav-link {% if active_menu == 'riwayat' %}active{% endif %}">
                <i class="bi bi-clock-history"></i> Riwayat
            </a>
            <a href="{% url 'kesiswaan_lengkapi_profil' %}" class="nav-link {% if active_menu == 'profil' %}active{% endif %}">
                <i class="bi bi-person-circle"></i> Profil Saya
            </a>
        </div>
        {% endif %}

        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-box-arrow-right"></i> Keluar
        </a>
    </div>
</nav>

<div class="content-wrap">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'success' }}{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
